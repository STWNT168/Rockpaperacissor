<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Rock Paper Scissors Online</title>
<style>
:root{
  --bg:#1b1f2a; --panel:#262c3b; --ink:#f3efe6; --muted:#9aa3b8;
  --win:#5bd68a; --lose:#ff6b6b; --draw:#f2c94c; --accent:#7aa2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
main{width:100%;max-width:420px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%;padding:20px 0}
h1{font-size:30px;margin:0;text-align:center;letter-spacing:.5px}
.sub{color:var(--muted);text-align:center;margin:-8px 0 0}
.card{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--muted)}
input{
  width:100%;padding:14px;border-radius:12px;border:2px solid #394058;background:#1b1f2a;color:var(--ink);
  font-size:18px;font-family:inherit
}
input:focus{outline:none;border-color:var(--accent)}
#code-in{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px}
button{
  font-family:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;padding:15px;
  background:var(--accent);color:#10131c;cursor:pointer
}
button.alt{background:#394058;color:var(--ink)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}
.big-code{font-size:52px;letter-spacing:10px;text-align:center;font-weight:800;color:var(--accent);margin:4px 0}
.note{color:var(--muted);font-size:14px;text-align:center;margin:0}
.err{color:var(--lose);text-align:center;margin:0;min-height:1.2em;font-size:14px}

.scoreboard{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{flex:1;text-align:center}
.side .nm{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sc{font-size:44px;font-weight:800;line-height:1.1}
.mid{color:var(--muted);font-size:14px;text-align:center}
.arena{display:flex;justify-content:space-around;align-items:center;min-height:120px}
.hand{font-size:72px;transition:transform .25s}
.hand.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.hand.pop{animation:none}}
.result{text-align:center;font-size:26px;font-weight:800;min-height:34px}
.result.win{color:var(--win)}.result.lose{color:var(--lose)}.result.draw{color:var(--draw)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.picks button{font-size:46px;padding:14px 0;background:var(--panel);border:2px solid #394058}
.picks button.sel{border-color:var(--accent);background:#31395a}
.status{text-align:center;color:var(--muted);min-height:1.4em}
</style>
</head>
<body>
<main>
  <h1>Rock Paper Scissors</h1>
  <p class="sub" id="sub">Play a friend on another phone. First to 3 wins.</p>

  <!-- LOBBY -->
  <section id="lobby" class="card">
    <label for="name">Your name</label>
    <input id="name" maxlength="14" placeholder="e.g. Satwant" autocomplete="off">
    <button id="host-btn">Create room</button>
    <p class="note">or join a friend's room</p>
    <input id="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
    <button id="join-btn" class="alt">Join room</button>
    <p class="err" id="lobby-err"></p>
  </section>

  <!-- WAITING -->
  <section id="waiting" class="card hidden">
    <p class="note">Share this code with your friend</p>
    <div class="big-code" id="room-code">----</div>
    <button id="copy-btn" class="alt">Copy invite link</button>
    <p class="note">Waiting for them to join…</p>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="scoreboard">
        <div class="side"><div class="nm" id="my-name">You</div><div class="sc" id="my-score">0</div></div>
        <div class="mid" id="round-lbl">Round 1</div>
        <div class="side"><div class="nm" id="opp-name">Opponent</div><div class="sc" id="opp-score">0</div></div>
      </div>
      <div class="arena">
        <div class="hand" id="my-hand">❔</div>
        <div class="hand" id="opp-hand">❔</div>
      </div>
      <div class="result" id="result"></div>
    </div>
    <div class="picks" id="picks">
      <button data-v="rock" aria-label="Rock">✊</button>
      <button data-v="paper" aria-label="Paper">✋</button>
      <button data-v="scissors" aria-label="Scissors">✌️</button>
    </div>
    <div class="status" id="status">Pick your move</div>
    <button id="again-btn" class="hidden">Play again</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const EMOJI = {rock:'✊', paper:'✋', scissors:'✌️'};
const BEATS = {rock:'scissors', paper:'rock', scissors:'paper'};
const WIN_AT = 3;
const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const PREFIX = 'rps-online-';

let peer = null, conn = null, roomCode = '';
let myName = '', oppName = 'Opponent';
let myPick = null, theirPick = null;
let score = {me:0, opp:0}, round = 1, matchOver = false, resolving = false;

function show(id){
  ['lobby','waiting','game'].forEach(s => {
    const el = $(s);
    el.classList.toggle('hidden', s !== id);
  });
  $('sub').classList.toggle('hidden', id === 'game');
}
function randCode(){
  let c=''; for(let i=0;i<4;i++) c += CHARS[Math.floor(Math.random()*CHARS.length)];
  return c;
}
function getName(){
  const n = $('name').value.trim();
  return n || 'Player';
}
function lobbyError(msg){ $('lobby-err').textContent = msg; }

// ---------- HOST ----------
function hostRoom(){
  myName = getName();
  localStorage.setItem('rps-name', myName);
  lobbyError('');
  roomCode = randCode();
  if (peer) peer.destroy();
  peer = new Peer(PREFIX + roomCode);
  peer.on('open', () => {
    $('room-code').textContent = roomCode;
    show('waiting');
  });
  peer.on('connection', c => {
    if (conn) { c.close(); return; }   // room is full
    setupConn(c);
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { hostRoom(); return; }  // code clash, retry
    lobbyError('Connection problem: ' + e.type);
    show('lobby');
  });
}

// ---------- JOIN ----------
function joinRoom(code){
  myName = getName();
  localStorage.setItem('rps-name', myName);
  code = (code || '').toUpperCase().trim();
  if (code.length !== 4) { lobbyError('Enter the 4-character room code.'); return; }
  lobbyError('Connecting…');
  roomCode = code;
  if (peer) peer.destroy();
  peer = new Peer();
  peer.on('open', () => {
    const c = peer.connect(PREFIX + code, {reliable:true});
    setupConn(c);
    setTimeout(() => {
      if (!c.open && !conn.__ok) lobbyError('Could not reach that room. Check the code and try again.');
    }, 12000);
  });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable') lobbyError('Room not found. Check the code.');
    else lobbyError('Connection problem: ' + e.type);
    show('lobby');
  });
}

// ---------- CONNECTION ----------
function setupConn(c){
  conn = c;
  const ready = () => {
    c.__ok = true;
    c.send({t:'hi', name:myName});
    resetMatch();
    show('game');
  };
  c.on('open', ready);
  if (c.open) ready();
  c.on('data', onData);
  c.on('close', () => {
    $('status').textContent = 'Opponent disconnected.';
    $('picks').querySelectorAll('button').forEach(b => b.disabled = true);
    $('again-btn').textContent = 'Back to lobby';
    $('again-btn').classList.remove('hidden');
    $('again-btn').onclick = () => location.reload();
  });
}
function send(msg){ if (conn && conn.open) conn.send(msg); }

function onData(m){
  if (m.t === 'hi'){ oppName = (m.name || 'Opponent').slice(0,14); $('opp-name').textContent = oppName; }
  else if (m.t === 'pick'){ theirPick = m.v; tryResolve(); }
  else if (m.t === 'again'){ resetMatch(); }
}

// ---------- GAME ----------
function resetMatch(){
  score = {me:0, opp:0}; round = 1; matchOver = false;
  $('again-btn').classList.add('hidden');
  newRound();
  $('my-name').textContent = myName;
  $('opp-name').textContent = oppName;
  renderScore();
}
function newRound(){
  myPick = null; theirPick = null; resolving = false;
  $('my-hand').textContent = '❔'; $('opp-hand').textContent = '❔';
  $('my-hand').classList.remove('pop'); $('opp-hand').classList.remove('pop');
  $('result').textContent = ''; $('result').className = 'result';
  $('round-lbl').textContent = 'Round ' + round;
  $('status').textContent = 'Pick your move';
  $('picks').querySelectorAll('button').forEach(b => { b.disabled = false; b.classList.remove('sel'); });
}
function renderScore(){
  $('my-score').textContent = score.me;
  $('opp-score').textContent = score.opp;
}
function choose(v){
  if (myPick || matchOver) return;
  myPick = v;
  send({t:'pick', v});
  $('picks').querySelectorAll('button').forEach(b => {
    b.disabled = true; b.classList.toggle('sel', b.dataset.v === v);
  });
  $('my-hand').textContent = '✅';
  $('status').textContent = theirPick ? '' : 'Waiting for ' + oppName + '…';
  tryResolve();
}
function tryResolve(){
  if (!myPick || !theirPick || resolving) return;
  resolving = true;
  $('my-hand').textContent = EMOJI[myPick];
  $('opp-hand').textContent = EMOJI[theirPick];
  $('my-hand').classList.add('pop'); $('opp-hand').classList.add('pop');

  const r = $('result');
  if (myPick === theirPick){ r.textContent = 'Draw'; r.className = 'result draw'; }
  else if (BEATS[myPick] === theirPick){ r.textContent = 'You win the round'; r.className = 'result win'; score.me++; }
  else { r.textContent = oppName + ' wins the round'; r.className = 'result lose'; score.opp++; }
  renderScore();
  $('status').textContent = '';

  if (score.me >= WIN_AT || score.opp >= WIN_AT){
    matchOver = true;
    const won = score.me >= WIN_AT;
    setTimeout(() => {
      r.textContent = won ? '🏆 You win the match!' : oppName + ' wins the match';
      r.className = 'result ' + (won ? 'win' : 'lose');
      $('again-btn').textContent = 'Play again';
      $('again-btn').onclick = () => { send({t:'again'}); resetMatch(); };
      $('again-btn').classList.remove('hidden');
    }, 1400);
  } else {
    round++;
    setTimeout(newRound, 2200);
  }
}

// ---------- UI WIRING ----------
$('host-btn').onclick = hostRoom;
$('join-btn').onclick = () => joinRoom($('code-in').value);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom($('code-in').value); });
document.querySelectorAll('#picks button').forEach(b => b.onclick = () => choose(b.dataset.v));
$('copy-btn').onclick = async () => {
  const url = location.origin + location.pathname + '?room=' + roomCode;
  try { await navigator.clipboard.writeText(url); $('copy-btn').textContent = 'Link copied'; }
  catch { $('copy-btn').textContent = url; }
};

try { $('name').value = localStorage.getItem('rps-name') || ''; } catch {}
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) $('code-in').value = roomParam.slice(0,4).toUpperCase();
</script>
</body>
</html>
