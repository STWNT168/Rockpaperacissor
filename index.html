<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f2a">
<title>Rock Paper Scissors Online</title>
<style>
:root{
  --bg:#1b1f2a; --panel:#262c3b; --ink:#f3efe6; --muted:#9aa3b8;
  --win:#5bd68a; --lose:#ff6b6b; --draw:#f2c94c; --accent:#7aa2ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;justify-content:center;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
}
main{width:100%;max-width:420px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:100%;padding:20px 0}
h1{font-size:30px;margin:0;text-align:center;letter-spacing:.5px}
.sub{color:var(--muted);text-align:center;margin:-8px 0 0}
.card{background:var(--panel);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
label{font-size:14px;color:var(--muted)}
input{
  width:100%;padding:14px;border-radius:12px;border:2px solid #394058;background:#1b1f2a;color:var(--ink);
  font-size:18px;font-family:inherit
}
input:focus{outline:none;border-color:var(--accent)}
#code-in{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:24px}
button{
  font-family:inherit;font-size:17px;font-weight:700;border:0;border-radius:14px;padding:15px;
  background:var(--accent);color:#10131c;cursor:pointer
}
button.alt{background:#394058;color:var(--ink)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hidden{display:none!important}
.big-code{font-size:52px;letter-spacing:10px;text-align:center;font-weight:800;color:var(--accent);margin:4px 0}
.note{color:var(--muted);font-size:14px;text-align:center;margin:0}
.err{color:var(--lose);text-align:center;margin:0;min-height:1.2em;font-size:14px}

.scoreboard{display:flex;justify-content:space-between;align-items:center;gap:8px}
.side{flex:1;text-align:center;min-width:0}
.side .nm{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .sc{font-size:44px;font-weight:800;line-height:1.1}
.mid{color:var(--muted);font-size:14px;text-align:center}
.arena{display:flex;justify-content:space-around;align-items:center;min-height:120px}
.hand{font-size:72px}
.hand.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.3) rotate(-20deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.hand.pop{animation:none}}
.result{text-align:center;font-size:26px;font-weight:800;min-height:34px}
.result.win{color:var(--win)}.result.lose{color:var(--lose)}.result.draw{color:var(--draw)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.picks button{font-size:46px;padding:14px 0;background:var(--panel);border:2px solid #394058}
.picks button.sel{border-color:var(--accent);background:#31395a}
.status{text-align:center;color:var(--muted);min-height:1.4em}
#mute-btn{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:46px;height:46px;padding:0;font-size:22px;border-radius:50%;z-index:5}
</style>
</head>
<body>
<button id="mute-btn" class="alt" aria-label="Toggle sound">🔊</button>
<main>
  <h1>Rock Paper Scissors</h1>
  <p class="sub" id="sub">Play a friend on another phone. Keep playing as long as you like.</p>

  <!-- LOBBY -->
  <section id="lobby" class="card">
    <label for="name">Your name</label>
    <input id="name" maxlength="14" placeholder="e.g. Satwant" autocomplete="off">
    <button id="host-btn">Create room</button>
    <p class="note">or join a friend's room</p>
    <input id="code-in" maxlength="4" placeholder="CODE" autocomplete="off">
    <button id="join-btn" class="alt">Join room</button>
    <p class="err" id="lobby-err"></p>
  </section>

  <!-- WAITING -->
  <section id="waiting" class="card hidden">
    <p class="note">Share this code with your friend</p>
    <div class="big-code" id="room-code">----</div>
    <button id="copy-btn" class="alt">Copy invite link</button>
    <p class="note">Waiting for them to join…</p>
  </section>

  <!-- GAME -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="scoreboard">
        <div class="side"><div class="nm" id="my-name">You</div><div class="sc" id="my-score">0</div></div>
        <div class="mid" id="round-lbl">Round 1</div>
        <div class="side"><div class="nm" id="opp-name">Opponent</div><div class="sc" id="opp-score">0</div></div>
      </div>
      <div class="arena">
        <div class="hand" id="my-hand">❔</div>
        <div class="hand" id="opp-hand">❔</div>
      </div>
      <div class="result" id="result"></div>
    </div>
    <div class="picks" id="picks">
      <button data-v="rock" aria-label="Rock">✊</button>
      <button data-v="paper" aria-label="Paper">✋</button>
      <button data-v="scissors" aria-label="Scissors">✌️</button>
    </div>
    <div class="status" id="status">Pick your move</div>
    <button id="reset-btn" class="alt">Reset score</button>
    <button id="again-btn" class="hidden">Play again</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const EMOJI = {rock:'✊', paper:'✋', scissors:'✌️'};
const BEATS = {rock:'scissors', paper:'rock', scissors:'paper'};
const WIN_AT = 3;
const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- SOUND EFFECTS (generated with Web Audio, no files) ---------- */
let AC = null, muted = false;
try { muted = localStorage.getItem('rps-muted') === '1'; } catch (e) {}
function ac(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, start, dur, type = 'sine', vol = .18, slideTo){
  const a = ac(); if (!a || muted) return;
  const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .02);
}
const SFX = {
  tap:    () => tone(520, 0, .08, 'triangle'),
  pick:   () => { tone(440, 0, .08, 'square', .1); tone(660, .07, .1, 'square', .1); },
  reveal: () => tone(220, 0, .18, 'sawtooth', .14, 80),
  win:    () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .09, .2, 'triangle', .2)),
  lose:   () => [392, 330, 262, 196].forEach((f, i) => tone(f, i * .12, .24, 'sawtooth', .1)),
  draw:   () => { tone(330, 0, .12, 'square', .1); tone(330, .16, .12, 'square', .1); },
  join:   () => { tone(660, 0, .1); tone(880, .1, .18); },
  leave:  () => tone(400, 0, .35, 'sine', .15, 150)
};
function sfx(n){ try { SFX[n](); } catch (e) {} }

/* ---------- NETWORK: public MQTT brokers over secure WebSocket ----------
   We connect to every broker at once and send on all of them, so the game
   works as long as either one is reachable from each phone. Duplicates are
   dropped by message id. */
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081'
];
const UID = Math.random().toString(36).slice(2, 10);
let clients = [], seen = new Set(), seq = 0;
let roomCode = '', isHost = false, peerId = null, hostSeen = false, presenceOn = false;
let joinTimer = null;
const T = k => 'rps-online-v1/' + roomCode + '/' + k;

function openNet(willMsg){
  return new Promise((resolve, reject) => {
    let resolved = false;
    BROKERS.forEach(url => {
      let c;
      try {
        c = mqtt.connect(url, {
          clientId: 'rps_' + UID + '_' + Math.random().toString(36).slice(2, 6),
          connectTimeout: 8000, reconnectPeriod: 4000, clean: true,
          will: {topic: T('m'), payload: JSON.stringify(willMsg), qos: 0, retain: false}
        });
      } catch (e) { return; }
      clients.push(c);
      c.on('connect', () => {
        c.subscribe([T('m'), T('host')], {qos: 0});
        if (presenceOn) c.publish(T('host'), JSON.stringify({t:'room'}), {retain:true});
        if (!resolved){ resolved = true; resolve(); }
      });
      c.on('message', (topic, payload) => onRaw(topic, payload.toString()));
      c.on('error', () => {});
    });
    setTimeout(() => { if (!resolved) reject(new Error('timeout')); }, 10000);
  });
}
function closeNet(){
  clients.forEach(c => { try { c.end(true); } catch (e) {} });
  clients = []; seen = new Set(); hostSeen = false; presenceOn = false;
  clearInterval(joinTimer);
}
function send(obj){
  obj.from = UID; obj.id = UID + '-' + (seq++);
  const s = JSON.stringify(obj);
  clients.forEach(c => { if (c.connected) c.publish(T('m'), s); });
}
function onRaw(topic, text){
  if (topic === T('host')){ if (text) hostSeen = true; return; }
  let m; try { m = JSON.parse(text); } catch (e) { return; }
  if (!m || m.from === UID || seen.has(m.id)) return;
  seen.add(m.id);
  onMsg(m);
}

/* ---------- LOBBY ---------- */
function show(id){
  ['lobby','waiting','game'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  $('sub').classList.toggle('hidden', id === 'game');
}
function randCode(){
  let c = ''; for (let i = 0; i < 4; i++) c += CHARS[Math.floor(Math.random() * CHARS.length)];
  return c;
}
function getName(){ return $('name').value.trim() || 'Player'; }
function lobbyError(msg){ $('lobby-err').textContent = msg; }
const NET_ERR = 'Cannot reach the game server. Check your internet and try again.';
let myName = '', oppName = 'Opponent';

async function hostRoom(attempt = 0){
  myName = getName();
  try { localStorage.setItem('rps-name', myName); } catch (e) {}
  lobbyError('Creating room…');
  closeNet(); isHost = true; peerId = null;
  roomCode = randCode();
  try { await openNet({t:'bye', from:UID, id:'will-' + UID}); }
  catch (e) { lobbyError(NET_ERR); closeNet(); return; }
  await sleep(1500);                       // see if this code is already taken
  if (hostSeen && attempt < 6) return hostRoom(attempt + 1);
  presenceOn = true;
  clients.forEach(c => { if (c.connected) c.publish(T('host'), JSON.stringify({t:'room'}), {retain:true}); });
  $('room-code').textContent = roomCode;
  lobbyError('');
  show('waiting');
}

async function joinRoom(code){
  myName = getName();
  try { localStorage.setItem('rps-name', myName); } catch (e) {}
  code = (code || '').toUpperCase().trim();
  if (code.length !== 4){ lobbyError('Enter the 4-character room code.'); return; }
  lobbyError('Connecting…');
  closeNet(); isHost = false; peerId = null; roomCode = code;
  try { await openNet({t:'bye', from:UID, id:'will-' + UID}); }
  catch (e) { lobbyError(NET_ERR); closeNet(); return; }
  for (let i = 0; i < 25 && !hostSeen; i++) await sleep(200);   // wait up to 5 s for the room
  if (!hostSeen){ lobbyError('Room not found. Check the code.'); closeNet(); return; }
  let tries = 0;
  const ping = () => {
    if (peerId){ clearInterval(joinTimer); return; }
    if (++tries > 6){
      clearInterval(joinTimer);
      lobbyError('Host did not answer. Ask them to create a new room.');
      closeNet(); return;
    }
    send({t:'join', name:myName});
  };
  ping();
  joinTimer = setInterval(ping, 1500);
}

/* ---------- MESSAGES ---------- */
function onMsg(m){
  if (m.to && m.to !== UID) return;
  if (isHost){
    if (m.t === 'join'){
      if (!peerId){
        peerId = m.from; oppName = (m.name || 'Opponent').slice(0, 14);
        send({t:'welcome', name:myName, to:m.from});
        startGame();
      } else if (peerId === m.from){
        send({t:'welcome', name:myName, to:m.from});
      } else {
        send({t:'full', to:m.from});
      }
      return;
    }
  } else {
    if (m.t === 'welcome' && !peerId){
      peerId = m.from; oppName = (m.name || 'Opponent').slice(0, 14);
      clearInterval(joinTimer);
      startGame();
      return;
    }
    if (m.t === 'full'){
      clearInterval(joinTimer);
      lobbyError('That room already has two players.');
      closeNet(); return;
    }
  }
  if (m.from !== peerId) return;
  if (m.t === 'pick'){ theirPick = m.v; tryResolve(); }
  else if (m.t === 'again'){ resetMatch(); }
  else if (m.t === 'bye'){ onPeerLeft(); }
}
function onPeerLeft(){
  $('status').textContent = 'Opponent left the game.';
  $('reset-btn').classList.add('hidden');
  sfx('leave');
  $('picks').querySelectorAll('button').forEach(b => b.disabled = true);
  $('again-btn').textContent = 'Back to lobby';
  $('again-btn').classList.remove('hidden');
  $('again-btn').onclick = () => location.reload();
}

/* ---------- GAME ---------- */
let myPick = null, theirPick = null;
let score = {me:0, opp:0}, round = 1, matchOver = false, resolving = false;

function startGame(){
  if (isHost){   // room is full: remove the public "room exists" marker
    clients.forEach(c => { if (c.connected) c.publish(T('host'), '', {retain:true}); });
    presenceOn = false;
  }
  lobbyError('');
  resetMatch();
  show('game');
  sfx('join');
}
function resetMatch(){
  score = {me:0, opp:0}; round = 1; matchOver = false;
  $('again-btn').classList.add('hidden');
  $('my-name').textContent = myName;
  $('opp-name').textContent = oppName;
  renderScore();
  newRound();
}
function newRound(){
  myPick = null; theirPick = null; resolving = false;
  $('my-hand').textContent = '❔'; $('opp-hand').textContent = '❔';
  $('my-hand').classList.remove('pop'); $('opp-hand').classList.remove('pop');
  $('result').textContent = ''; $('result').className = 'result';
  $('round-lbl').textContent = 'Round ' + round;
  $('status').textContent = 'Pick your move';
  $('picks').querySelectorAll('button').forEach(b => { b.disabled = false; b.classList.remove('sel'); });
}
function renderScore(){
  $('my-score').textContent = score.me;
  $('opp-score').textContent = score.opp;
}
function choose(v){
  if (myPick || matchOver) return;
  myPick = v;
  sfx('pick');
  send({t:'pick', v});
  $('picks').querySelectorAll('button').forEach(b => {
    b.disabled = true; b.classList.toggle('sel', b.dataset.v === v);
  });
  $('my-hand').textContent = '✅';
  $('status').textContent = theirPick ? '' : 'Waiting for ' + oppName + '…';
  tryResolve();
}
function tryResolve(){
  if (!myPick || !theirPick || resolving) return;
  resolving = true;
  $('my-hand').textContent = EMOJI[myPick];
  $('opp-hand').textContent = EMOJI[theirPick];
  $('my-hand').classList.add('pop'); $('opp-hand').classList.add('pop');

  const r = $('result');
  let outcome;
  if (myPick === theirPick){ outcome = 'draw'; r.textContent = 'Draw'; r.className = 'result draw'; }
  else if (BEATS[myPick] === theirPick){ outcome = 'win'; r.textContent = 'You win the round'; r.className = 'result win'; score.me++; }
  else { outcome = 'lose'; r.textContent = oppName + ' wins the round'; r.className = 'result lose'; score.opp++; }
  sfx('reveal');
  setTimeout(() => sfx(outcome), 300);
  renderScore();
  $('status').textContent = '';

  round++;
  setTimeout(newRound, 2200);
}

/* ---------- UI WIRING ---------- */
function paintMute(){ $('mute-btn').textContent = muted ? '🔇' : '🔊'; }
paintMute();
$('mute-btn').onclick = () => {
  muted = !muted;
  try { localStorage.setItem('rps-muted', muted ? '1' : '0'); } catch (e) {}
  paintMute();
  sfx('tap');
};
document.addEventListener('pointerdown', ac);   // phones only allow audio after a tap
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && !b.closest('#picks') && b.id !== 'mute-btn') sfx('tap');
});
$('reset-btn').onclick = () => { send({t:'again'}); resetMatch(); };
$('host-btn').onclick = () => hostRoom();
$('join-btn').onclick = () => joinRoom($('code-in').value);
$('code-in').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom($('code-in').value); });
document.querySelectorAll('#picks button').forEach(b => b.onclick = () => choose(b.dataset.v));
$('copy-btn').onclick = async () => {
  const url = location.origin + location.pathname + '?room=' + roomCode;
  try { await navigator.clipboard.writeText(url); $('copy-btn').textContent = 'Link copied'; }
  catch (e) { $('copy-btn').textContent = url; }
};
window.addEventListener('pagehide', () => {
  if (!clients.length) return;
  send({t:'bye'});
  if (isHost) clients.forEach(c => { if (c.connected) c.publish(T('host'), '', {retain:true}); });
});

try { $('name').value = localStorage.getItem('rps-name') || ''; } catch (e) {}
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) $('code-in').value = roomParam.slice(0, 4).toUpperCase();
</script>
</body>
</html>
